<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Héros d'Ardyn</title>
  <meta name="theme-color" content="#161c27">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;0,800;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"><p class="wrap muted">Chargement de la table…</p></div>
  <div id="dice-stage" aria-hidden="true"></div>
  <div id="dice-result" aria-live="polite"></div>
  <script>
    // Garde-fou : si l'app ne démarre pas, on affiche la raison au lieu de « Chargement » à l'infini.
    window.__bootErrors = [];
    addEventListener("error", (e) => __bootErrors.push((e.message || "") + " " + (e.filename || e.target?.src || "")), true);
    addEventListener("unhandledrejection", (e) => __bootErrors.push(String(e.reason?.message || e.reason)));
    setTimeout(() => {
      const a = document.getElementById("app");
      if (a && /Chargement de la table/.test(a.textContent)) a.innerHTML = '<main class="wrap"><h2>L\'app ne démarre pas</h2><p>Recharge la page en forçant la mise à jour (Ctrl + Maj + R sur ordinateur, ou ferme et rouvre l\'onglet sur téléphone).</p><p class="small muted">' + (__bootErrors.join("<br>") || "Aucune erreur détectée.").replace(/</g, "&lt;").replace(/&lt;br>/g, "<br>") + '</p></main>';
    }, 12000);
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
